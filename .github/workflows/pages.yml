name: Despliegue en GitHub Pages

# Compila la app (Vite) y publica dist/ en GitHub Pages cada vez que se actualiza la rama por
# defecto del repositorio (sea cual sea su nombre), o a mano desde la pestaña Actions.
# Requiere Settings → Pages → Build and deployment → Source: «GitHub Actions». Con «Deploy from a
# branch», Pages sirve el index.html de las fuentes, que pide /src/main.tsx, y la página sale en blanco.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un grupo por rama: los push a otras ramas (que no despliegan) no cancelan un despliegue en curso.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
